<div class="card bg-gradient-to-br from-indigo-900 to-slate-900 border-indigo-500/50">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xs font-black text-indigo-400 uppercase tracking-widest italic">AI Sector Predictor</h2>
        <span class="badge bg-indigo-500/20 text-indigo-300 text-[10px] px-2 py-1 rounded">RANDOM FOREST</span>
    </div>
    
    <div class="text-center py-4">
        <p class="text-sm text-slate-400 uppercase font-bold tracking-tighter">AI Overweight Pick</p>
        <h3 class="text-5xl font-black text-white my-2">{{ ml_sector.name }}</h3>
        <p class="text-indigo-400 font-mono text-xl">{{ ml_sector.ticker }}</p>
    </div>

    <div class="mt-4">
        <div class="flex justify-between items-center mb-1">
            <span class="label-small text-indigo-300">Signal Confidence</span>
            <span class="label-small font-mono text-indigo-300">{{ ml_sector.confidence }}%</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-indigo-500/20">
            <div class="bg-indigo-500 h-full shadow-[0_0_10px_#6366f1]" style="width: {{ ml_sector.confidence }}%"></div>
        </div>
        <p class="text-[9px] text-slate-500 mt-3 italic text-center">
            Features: DXY, MOVE, VIX, TNX Correlation
        </p>
    </div>
</div>
