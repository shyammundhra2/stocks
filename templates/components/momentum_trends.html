<div class="card">
    <h2 class="text-xs font-black text-yellow-400 uppercase tracking-widest mb-6">Momentum Trends (Regression + ML)</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for item in trends %}
        <div class="trend-card card flex justify-between items-center">
            <div class="w-full">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="label-small">{{ item.sym }} — ${{ item.price }}</span>
                        <p class="font-bold text-white leading-tight">{{ item.name }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black {{ 'status-purple' if item.status=='STRONG BUY' else 'status-green' if item.status=='BUY' else 'status-yellow' if 'Weakening' in item.status else 'status-red' }}">
                            {{ item.status }}
                        </p>
                        <p class="label-small uppercase font-bold">Stop: ${{ item.stop }}</p>
                    </div>
                </div>
                
                <div class="mt-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="label-small text-blue-400">ML Confidence</span>
                        <span class="label-small font-mono">{{ item.ml_conf }}%</span>
                    </div>
                    <div class="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                        <div class="bg-blue-500 h-full" style="width: {{ item.ml_conf }}%"></div>
                    </div>
                </div>

                <div class="flex gap-4 mt-3">
                    <p class="label-small font-mono">R²: {{ item.r2 }}</p>
                    <p class="label-small font-mono italic">Slope: {{ item.slope }}%</p>
                    <p class="label-small font-mono text-slate-500">RSI: {{ item.rsi14 }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
