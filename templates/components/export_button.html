<!-- components/export_button.html -->
<div class="flex justify-end mb-4 gap-6">
    <div class="flex flex-col items-center">
        <img
            src="{{ url_for('static', filename='images/copy.png') }}"
            alt="Copy Dashboard"
            class="h-10 w-10 cursor-pointer hover:opacity-80 transition-transform active:scale-95"
            onclick="copyDashboard()"
        >
        <span id="copy-label" class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-tighter">
            Copy Report
        </span>
    </div>
</div>

<script>
// Embed the data directly from Flask
const REPORT_DATA = {{ all_data_json|safe }};

// Tabular / ASCII report designed to paste straight into an LLM (Claude).
function formatJsonAsReadableText(data) {
    if (!data) return "Error: Could not generate report";

    const get = (obj, path, d = '') => {
        try { return path.split('.').reduce((o, p) => o?.[p], obj) ?? d; } catch { return d; }
    };
    const num = (x, d = 2) => (x === null || x === undefined || x === '' || isNaN(x)) ? '' : Number(x).toFixed(d);

    // Fixed-width table. aligns[i] = 'r' right-aligns (numbers), else left.
    const table = (headers, rows, aligns = []) => {
        const w = headers.map((h, i) =>
            Math.max(String(h).length, 1, ...rows.map(r => String(r[i] ?? '').length)));
        const cell = (c, i) => {
            const s = String(c ?? '');
            return aligns[i] === 'r' ? s.padStart(w[i]) : s.padEnd(w[i]);
        };
        let out = headers.map(cell).join('  ') + "\n";
        out += w.map(x => '-'.repeat(x)).join('  ') + "\n";
        rows.forEach(r => { out += r.map(cell).join('  ') + "\n"; });
        return out;
    };
    const rule = (n = 66) => '='.repeat(n) + "\n";

    let t = "";
    t += rule();
    t += "MACRO SYSTEM REPORT   " + new Date().toLocaleString() + "\n";
    t += rule();

    // --- REGIME ---
    const reg = data.regime || {};
    t += `Regime: ${get(reg, 'status')} (${get(reg, 'regime_qualifier', '-')})   `
       + `Confidence ${get(reg, 'confidence')}%   Composite ${get(reg, 'composite')}%   `
       + `ml_slow ${get(reg, 'ml_slow')}%\n`;
    t += `VIX ${get(data, 'vix_mr.vix')} (z ${get(data, 'vix_mr.z')}) ${get(data, 'vix_mr.signal')}   |   `
       + `QQQ RSI2 ${get(data, 'mr.rsi2')} -> ${get(data, 'mr.signal')} (@${get(data, 'mr.price')})\n`;
    const conds = (reg.details || []).map(m => `${String(get(m, 'label')).split(' ')[0]}[${m.pass ? 'Y' : 'N'}]`).join(' ');
    if (conds) t += `Conditions: ${conds}\n`;
    if (reg.hmm) t += `HMM: ${get(reg, 'hmm.most_likely')}   P(crisis) ${num((get(reg, 'hmm.p_crisis', 0)) * 100, 1)}%\n`;

    // --- PORTFOLIO ---
    const ps = data.portfolio_summary || {};
    t += "\n" + `PORTFOLIO: Deployed ${get(ps, 'total_allocated')}%   Vol ${get(ps, 'portfolio_vol')}% (cap ${get(ps, 'vol_cap')}%)   `
       + `Positions ${get(ps, 'n_positions')}   Regime scalar ${num((get(ps, 'regime_scalar', 0)) * 100, 0)}%   `
       + `Top risk ${get(ps, 'max_risk_contributor')}\n\n`;

    // --- ACTIVE POSITIONS ---
    const trends = data.trends || [];
    const active = trends.filter(x => Number(x.dollar_amount) > 0);
    if (active.length) {
        t += "ACTIVE POSITIONS\n";
        t += table(
            ["SYM", "NAME", "STATUS", "$ALLOC", "WT%", "RISK%"],
            active.map(x => [x.sym, x.name, x.status, num(x.dollar_amount, 0), num(x.weight_pct, 1), num(x.risk_contribution, 1)]),
            ["l", "l", "l", "r", "r", "r"]
        ) + "\n";
    }

    // --- MOMENTUM TRENDS (all) ---
    if (trends.length) {
        t += "MOMENTUM TRENDS (all, sorted by conviction)\n";
        t += table(
            ["SYM", "PRICE", "STATUS", "SLOPE", "R2", "Z", "RSI", "ER", "STATE", "SIG", "H", "P(stp)%", "ALLOC$"],
            trends.map(x => [
                x.sym, num(x.price, 2), x.status, num(x.slope, 2), num(x.r2, 2), num(x.slope_z, 2),
                num(x.rsi14, 1), num(x.eff_ratio, 2), get(x, 'adaptive_state'), get(x, 'adaptive_signal'),
                num(x.hurst, 2), num((x.p_stop || 0) * 100, 0), num(x.dollar_amount, 0)
            ]),
            ["l", "r", "l", "r", "r", "r", "r", "r", "l", "l", "r", "r", "r"]
        ) + "\n";
    }

    // --- AI ML ALLOCATIONS ---
    const mlBlock = (title, m) => {
        if (!m) return "";
        let s = `${title}: OW ${get(m, 'top.name')} ${get(m, 'top.confidence')}%   `
              + `UW ${get(m, 'bottom.name')} ${get(m, 'bottom.confidence')}%   spread ${get(m, 'spread')}%\n`;
        const all = (m.all || []).slice(0, 8).map(x => `${get(x, 'name') || get(x, 'ticker')} ${get(x, 'confidence')}%`).join(', ');
        if (all) s += `  ${all}\n`;
        return s;
    };
    const mls = mlBlock("AI SECTOR", data.ml_sector) + mlBlock("AI COUNTRY", data.ml_country) + mlBlock("AI COMMODITY", data.ml_commodity);
    if (mls) t += mls + "\n";

    // --- ROTATION ---
    const rot = (title, arr) => {
        if (!Array.isArray(arr) || !arr.length) return "";
        return title + "\n" + table(
            ["NAME", "SLOPE", "R2", "dSLOPE", "GRAD"],
            arr.map(x => [get(x, 'name'), num(x.slope, 2), num(x.r2, 2), num(x.slope_change, 2), num(x.gradient, 0)]),
            ["l", "r", "r", "r", "r"]
        ) + "\n";
    };
    t += rot("SECTOR ROTATION", data.sr?.all_ranked);
    t += rot("COUNTRY ROTATION", data.countries);
    t += rot("COMMODITY ROTATION", data.commodities);
    t += rot("CURRENCY ROTATION (X->USD)", data.currencies);

    t += rule();
    t += "Columns: SLOPE=1000x daily log-return | R2=trend fit | Z=slope z-score | "
       + "ER=efficiency ratio[0-1] | STATE/SIG=adaptive router (TREND->MOM, CHOP->REV, else FLAT) | "
       + "H=Hurst[0-1] (discounts sizing below 0.45/above 0.55) | "
       + "P(stp)=stop-before-target prob\n";
    t += rule();
    return t;
}

function copyDashboard() {
    if (!REPORT_DATA) { alert('No data available to copy. Please refresh the page.'); return; }
    const text = formatJsonAsReadableText(REPORT_DATA);
    const label = document.getElementById('copy-label');
    navigator.clipboard.writeText(text).then(() => {
        const originalText = label.innerText;
        label.innerText = "COPIED";
        label.classList.remove('text-slate-500'); label.classList.add('text-green-600');
        setTimeout(() => {
            label.innerText = originalText;
            label.classList.remove('text-green-600'); label.classList.add('text-slate-500');
        }, 8000);
    }).catch(err => {
        console.error('Failed to copy: ', err);
        alert('Failed to copy to clipboard: ' + err.message);
    });
}
</script>
