<!-- components/export_button.html -->
<div class="flex justify-end mb-4 gap-6">
    <div class="flex flex-col items-center">
        <img
            src="{{ url_for('static', filename='images/copy.png') }}"
            alt="Copy Dashboard"
            class="h-10 w-10 cursor-pointer hover:opacity-80 transition-transform active:scale-95"
            onclick="copyDashboard()"
        >
        <span id="copy-label" class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-tighter">
            Copy Report
        </span>
    </div>

    <div class="flex flex-col items-center">
        <img
            src="{{ url_for('static', filename='images/export.png') }}"
            alt="Export Dashboard"
            class="h-10 w-10 cursor-pointer hover:opacity-80 transition-transform active:scale-95"
            onclick="exportDashboard()"
        >
        <span class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-tighter">
            Export Report
        </span>
    </div>
</div>

<script>
// Embed the data directly from Flask
const REPORT_DATA = {{ all_data_json|safe }};

function formatJsonAsReadableText(data) {
    if (!data) return "Error: Could not generate report";

    // Helper to safely get nested values
    const get = (obj, path, defaultVal = 'N/A') => {
        try {
            return path.split('.').reduce((o, p) => o?.[p], obj) ?? defaultVal;
        } catch {
            return defaultVal;
        }
    };

    // Helper to safely iterate arrays
    const forEach = (arr, callback) => {
        if (Array.isArray(arr)) arr.forEach(callback);
    };

    let text = "";
    const timestamp = new Date().toLocaleString();

    text += "==========================================\n";
    text += "       MACRO SYSTEM STRATEGY REPORT       \n";
    text += "       Generated: " + timestamp + "\n";
    text += "==========================================\n\n";

    // AI SECTOR ALLOCATION
    if (data.ml_sector) {
        text += "--- [I] AI SECTOR ALLOCATION ---\n";
        text += `REGIME: ${get(data, 'regime.status')}\n`;
        text += `TOP OVERWEIGHT:  ${get(data, 'ml_sector.top.name')} (${get(data, 'ml_sector.top.ticker')})\n`;
        text += `TOP UNDERWEIGHT: ${get(data, 'ml_sector.bottom.name')} (${get(data, 'ml_sector.bottom.ticker')})\n`;
        text += `TOP CONFIDENCE:  ${get(data, 'ml_sector.top.confidence')}%\n`;
        text += `SPREAD:          ${get(data, 'ml_sector.spread')}%\n\n`;
        text += "Sector Probability Distribution:\n";
        forEach(data.ml_sector.all, s => {
            text += `  - ${get(s, 'name')} (${get(s, 'ticker')}): ${get(s, 'confidence')}%\n`;
        });
        text += "\n";
    }

    // AI COUNTRY ALLOCATION
    if (data.ml_country) {
        text += "--- [II] AI COUNTRY ALLOCATION ---\n";
        text += `TOP OVERWEIGHT:  ${get(data, 'ml_country.top.name')} (${get(data, 'ml_country.top.ticker')})\n`;
        text += `TOP UNDERWEIGHT: ${get(data, 'ml_country.bottom.name')} (${get(data, 'ml_country.bottom.ticker')})\n`;
        text += `TOP CONFIDENCE:  ${get(data, 'ml_country.top.confidence')}%\n`;
        text += `SPREAD:          ${get(data, 'ml_country.spread')}%\n\n`;
        text += "Country Probability Distribution:\n";
        forEach(data.ml_country.all, c => {
            text += `  - ${get(c, 'name')} (${get(c, 'ticker')}): ${get(c, 'confidence')}%\n`;
        });
        text += "\n";
    }

    // AI COMMODITY ALLOCATION
    if (data.ml_commodity) {
        text += "--- [III] AI COMMODITY ALLOCATION ---\n";
        text += `TOP OVERWEIGHT:  ${get(data, 'ml_commodity.top.name')} (${get(data, 'ml_commodity.top.ticker')})\n`;
        text += `TOP UNDERWEIGHT: ${get(data, 'ml_commodity.bottom.name')} (${get(data, 'ml_commodity.bottom.ticker')})\n`;
        text += `TOP CONFIDENCE:  ${get(data, 'ml_commodity.top.confidence')}%\n`;
        text += `SPREAD:          ${get(data, 'ml_commodity.spread')}%\n\n`;
        text += "Commodity Probability Distribution:\n";
        forEach(data.ml_commodity.all, c => {
            text += `  - ${get(c, 'name')} (${get(c, 'sym')}): ${get(c, 'confidence')}%\n`;
        });
        text += "\n";
    }

    // VOLATILITY & RISK REGIME
    if (data.regime) {
        text += "--- [IV] VOLATILITY & RISK REGIME ---\n";
        forEach(data.regime.details, m => {
            text += `  - ${get(m, 'label')}: ${get(m, 'pass') === true ? 'PASS' : 'FAIL'}\n`;
        });
        text += `VIX Level: ${get(data, 'vix_mr.vix')} (Z: ${get(data, 'vix_mr.z')})\n`;
        text += `VIX Signal: ${get(data, 'vix_mr.signal', '').replace(/_/g, ' ')}\n\n`;
    }

    // TACTICAL MEAN REVERSION
    if (data.mr) {
        text += "--- [V] TACTICAL MEAN REVERSION (QQQ) ---\n";
        text += `Price: ${get(data, 'mr.price')}\n`;
        text += `RSI(2): ${get(data, 'mr.rsi2')}\n`;
        text += `Signal: ${get(data, 'mr.signal')}\n\n`;
    }

    // SECTOR ROTATION
    if (data.sr?.all_ranked) {
        text += "--- [VI] SECTOR ROTATION (3M RELATIVE) ---\n";
        forEach(data.sr.all_ranked, s => {
            text += `  - ${get(s, 'name')}: Slope ${get(s, 'slope')}% | ΔSlope ${get(s, 'slope_change', '0')}% | R2 ${get(s, 'r2')}\n`;
        });
        text += "\n";
    }

    // GLOBAL ROTATION
    text += "--- [VII] GLOBAL ROTATION (60D) ---\n";
    if (data.countries) {
        text += "Countries:\n";
        forEach(data.countries, c => {
            text += `  - ${get(c, 'name')} (${get(c, 'sym')}): Slope ${get(c, 'slope')}% | ΔSlope ${get(c, 'slope_change', '0')}% | R2 ${get(c, 'r2')}\n`;
        });
    }
    if (data.commodities) {
        text += "\nCommodities:\n";
        forEach(data.commodities, c => {
            text += `  - ${get(c, 'name')} (${get(c, 'sym')}): Slope ${get(c, 'slope')}% | ΔSlope ${get(c, 'slope_change', '0')}% | R2 ${get(c, 'r2')}\n`;
        });
    }
    if (data.currencies) {
        text += "\nCurrencies vs USD:\n";
        forEach(data.currencies, c => {
            text += `  - ${get(c, 'name')} (${get(c, 'sym')}): Slope ${get(c, 'slope')}% | ΔSlope ${get(c, 'slope_change', '0')}% | R2 ${get(c, 'r2')}\n`;
        });
    }
    text += "\n";

    // MOMENTUM TREND AUDIT
    if (data.trends) {
        text += "--- [VIII] MOMENTUM TREND AUDIT ---\n";
        forEach(data.trends, t => {
            text += `${(get(t, 'status', '') + '').padEnd(12)} | ${(get(t, 'name', '') + '').padEnd(14)} (${get(t, 'sym')}): `;
            text += `${get(t, 'price')} | ML ${get(t, 'ml_conf')}% | Stop ${get(t, 'stop')}\n`;
        });
        text += "\n";
    }

    text += "==========================================\n";
    text += "        END OF STRATEGY EXPORT            \n";
    text += "==========================================\n";

    return text;
}

function exportDashboard() {
    console.log('Exporting data...', REPORT_DATA);

    if (!REPORT_DATA) {
        alert('No data available to export. Please refresh the page.');
        return;
    }

    // Export as pretty-printed JSON
    const jsonText = JSON.stringify({
        generated_at: new Date().toISOString(),
        report_type: "macro_system_strategy",
        data: REPORT_DATA
    }, null, 2);

    const now = new Date();
    const blob = new Blob([jsonText], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Macro_Strategy_Report_' + now.toISOString().split('T')[0] + '.json';
    a.click();
}

function copyDashboard() {
    console.log('REPORT_DATA:', REPORT_DATA);

    if (!REPORT_DATA) {
        alert('No data available to copy. Please refresh the page.');
        return;
    }

    const text = formatJsonAsReadableText(REPORT_DATA);
    console.log('Generated text length:', text.length);
    console.log('Text preview:', text.substring(0, 200));

    const label = document.getElementById('copy-label');

    navigator.clipboard.writeText(text).then(() => {
        const originalText = label.innerText;
        label.innerText = "COPIED";
        label.classList.remove('text-slate-500');
        label.classList.add('text-green-600');

        setTimeout(() => {
            label.innerText = originalText;
            label.classList.remove('text-green-600');
            label.classList.add('text-slate-500');
        }, 20000);
    }).catch(err => {
        console.error('Failed to copy: ', err);
        alert('Failed to copy to clipboard: ' + err.message);
    });
}
</script>
