<div class="flex flex-col md:flex-row justify-between items-center bg-gray-900 p-8 rounded-xl border border-gray-800 mb-8 shadow-2xl text-white font-sans">

    <div class="flex-1">
        <h1 class="text-4xl font-black uppercase tracking-tight">
           GSS Macro<span class="text-blue-500">System</span>
        </h1>
        <div class="flex flex-wrap gap-3 mt-4">
            {% for m in regime.details %}
            <div class="flex items-center space-x-2 bg-gray-800 px-3 py-1 rounded-full border border-gray-700 shadow-sm">
                <div class="w-2 h-2 rounded-full {{ 'bg-green-500 shadow-[0_0_8px_#22c55e]' if m.pass else 'bg-red-500 shadow-[0_0_8px_#ef4444]' }}"></div>
                <span class="text-[10px] uppercase font-bold tracking-wider text-gray-400">{{ m.label }}</span>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="flex-1 flex flex-col items-center px-8 my-6 md:my-0">
        <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-1 font-bold">ML Confidence</p>

        <div class="text-6xl font-black mb-2 leading-none">{{ regime.confidence }}%</div>

        <div class="w-full max-w-[200px] bg-gray-800 rounded-full h-2 mb-6 overflow-hidden">
            <div class="h-full transition-all duration-500 {{ 'bg-green-500' if regime.status == 'RISK-ON' else 'bg-red-500' }}"
                 style="width: {{ regime.confidence }}%"></div>
        </div>

        <div class="flex flex-col items-center opacity-100 w-full">
            <svg class="w-32 h-8 overflow-visible mb-1" viewBox="0 0 100 40">
                <polyline fill="none" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round" class="opacity-30"
                    points="{% for p in regime.history %}{{ loop.index0 * 25 }},{{ 42 - (p/100 * 40) }} {% endfor %}" />
                <polyline fill="none" stroke="#818cf8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
                    points="{% for p in regime.history %}{{ loop.index0 * 25 }},{{ 40 - (p/100 * 40) }} {% endfor %}" />
                <circle cx="100" cy="{{ 40 - (regime.confidence/100 * 40) }}" r="4.5" fill="white" stroke="#818cf8" stroke-width="2" />
            </svg>
            <p class="text-[9px] uppercase tracking-[0.3em] text-indigo-400 font-black">History (20D Stride)</p>
        </div>
    </div>

    <div class="flex-1 text-right">
        <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 font-bold">Current Regime</p>
        <div class="text-7xl font-black italic tracking-tighter {{ 'text-green-500' if regime.status == 'RISK-ON' else 'text-red-500' }}">
            {{ regime.status }}
        </div>
    </div>
</div>
