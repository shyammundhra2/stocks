<div class="flex flex-col md:flex-row justify-between items-center card mb-8">
    <div>
        <h1 class="text-4xl font-black uppercase">
            Macro<span class="text-blue-500">System</span>
        </h1>
        <div class="flex flex-wrap gap-4 mt-3">
            {% for m in regime.details %}
            <div class="badge">
                <div class="badge-dot {{ 'green' if m.pass else 'red' }}"></div>
                <span class="label-small">{{ m.label }}</span>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="text-right">
        <p class="label-small uppercase tracking-widest">Market Regime</p>
        <div class="text-6xl font-black italic {{ 'status-green' if regime.status == 'RISK-ON' else 'status-red' }}">
            {{ regime.status }}
        </div>
    </div>
</div>
